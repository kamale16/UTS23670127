<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Daftar Produk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Daftar Produk</h1>

    <!-- Tombol dan Modal Tambah Kategori -->
    <button class="btn btn-secondary mb-3" data-bs-toggle="modal" data-bs-target="#tambahKategoriModal">
        Tambah Kategori
    </button>
    <div class="modal fade" id="tambahKategoriModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form method="POST" action="/tambah-kategori">
                    <div class="modal-header">
                        <h5 class="modal-title">Tambah Kategori</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="kategori-list">
                        <div class="kategori-entry mb-3">
                            <input type="text" class="form-control" name="nama[]" placeholder="Nama Kategori" required />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="tambahKategoriBtn" class="btn btn-secondary">Tambah Kategori Lagi</button>
                        <button type="submit" class="btn btn-primary">Simpan Semua Kategori</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Tombol dan Modal Tambah Produk -->
    <button class="btn btn-primary mb-3 ms-2" data-bs-toggle="modal" data-bs-target="#tambahProdukModal">
        Tambah Produk
    </button>
    <div class="modal fade" id="tambahProdukModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form method="POST" action="/tambah-produk">
                    <div class="mb-3">
                        <label class="form-label">Nama Produk</label>
                        <input type="text" class="form-control" name="nama" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Harga</label>
                        <input type="number" class="form-control" name="harga" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kategori</label>
                        <select class="form-control" name="kategori_id" required>
                            <option value="">Pilih Kategori</option>
                            {{ range .Kategori }}
                            <option value="{{ .ID }}">{{ .Nama }}</option>
                            {{ end }}
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Tambah</button>
                    </div>
                </form>
                
                  
                  <script>
                    document.getElementById('addProduk').addEventListener('click', function() {
                      const container = document.createElement('div');
                      container.classList.add('produk-entry');
                      container.innerHTML = `
                        <input type="text" name="nama[]" placeholder="Nama Produk" required />
                        <input type="number" step="0.01" name="harga[]" placeholder="Harga" required />
                        <select name="kategori_id[]" required>
                          <option value="">Pilih Kategori</option>
                          {{ range .Kategori }}
                          <option value="{{ .ID }}">{{ .Nama }}</option>
                          {{ end }}
                        </select>
                      `;
                      this.before(container);
                    });
                  </script>
                  
            </div>
        </div>
    </div>

    <!-- Tabel Produk -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama Produk</th>
                <th>Harga</th>
                <th>Kategori</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            {{ range .Produk }}
            <tr>
                <th scope="row">{{ .ID }}</th>
                <td>{{ .Nama }}</td>
                <td>{{ .Harga }}</td>
                <td>{{ .Kategori.Nama }}</td>
                <td>
                    <!-- Tombol Edit dan Hapus (tidak diubah) -->
                    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalEdit{{ .ID }}">
                        Edit
                    </button>
                    <a href="/hapus-produk?id={{ .ID }}" onclick="return confirm('Yakin ingin menghapus produk ini?')" class="btn btn-danger">
                        Hapus
                    </a>
                </td>
            </tr>
            {{ end }}
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Tambah input kategori baru
    document.getElementById('tambahKategoriBtn').addEventListener('click', function() {
        const container = document.createElement('div');
        container.classList.add('kategori-entry', 'mb-3');
        container.innerHTML = `<input type="text" class="form-control" name="nama[]" placeholder="Nama Kategori" required />`;
        document.getElementById('kategori-list').appendChild(container);
    });

    // Tambah input produk baru
    document.getElementById('tambahProdukBtn').addEventListener('click', function() {
        const container = document.createElement('div');
        container.classList.add('produk-entry', 'mb-3');
        container.innerHTML = `
            <input type="text" class="form-control mb-2" name="nama[]" placeholder="Nama Produk" required />
            <input type="number" step="0.01" class="form-control mb-2" name="harga[]" placeholder="Harga" required />
            <select class="form-select" name="kategori_id[]" required>
                <option value="">Pilih Kategori</option>
                {{ range .Kategori }}
                <option value="{{ .ID }}">{{ .Nama }}</option>
                {{ end }}
            </select>
        `;
        document.getElementById('produk-list').appendChild(container);
    });
</script>
</body>
</html>
